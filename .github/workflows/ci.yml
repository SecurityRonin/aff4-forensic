name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Only the repo-specific jobs at the bottom of this file read these. A called
# workflow does not inherit caller-level `env:`; the reusable workflow declares
# its own copy of exactly the same three.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -Dwarnings

jobs:
  ci:
    uses: SecurityRonin/fleet-ci/.github/workflows/rust-ci.yml@619094ad54edc586f5c2733358e00326b30790bd
    with:
      # The old `test` job ran on ubuntu-latest only. `true` would newly gate on
      # macOS and Windows, which nothing here has ever been shown to pass.
      os-matrix: false
      # The old MSRV job ran `cargo test --workspace` on 1.85, not a bare build.
      # The floor itself needs no input: every member declares rust-version
      # "1.85", so the workflow derives the same 1.85 it was pinned to.
      msrv-check: test
      # The old clippy/test/coverage jobs never passed --all-features, so the
      # optional `test-helpers` (zip) and `vfs` (forensic-vfs) features have
      # never been compiled in CI, and core/src/vfs.rs has never been measured
      # for coverage. Defaulting this to true would newly gate on both.
      all-features: false
      # The repo's own deny.toml, not the shared fleet config. Local is strictly
      # STRICTER: `[bans] multiple-versions = "deny"` (shared: "warn") and
      # `[advisories] ignore = []` (shared: 21 RUSTSEC ignores). Adopting the
      # shared file would loosen this gate, which an adoption PR must not do.
      deny-config-repo: ""
      # cargo-deny-action defaults its `arguments` input to `--all-features`, so
      # the old job checked the full-feature dependency graph. Carry that across.
      deny-args: --all-features
      # The per-line gate stays where it is — as the verbatim `coverage` job
      # below — because the shared `strict` gate cannot express it. Two reasons,
      # either of which would turn a green gate red:
      #   1. This repo's gate accepts a `// cov:unreachable` marker on the line
      #      ABOVE the uncovered line (llvm-cov attributes the zero-hit to
      #      either). Four of the five markers here sit on the line above
      #      (core/src/lib.rs 265->266, 370->371, 429->430; core/src/vfs.rs
      #      68->69). The shared gate reads only the line itself.
      #   2. core/src/lib.rs:370 carries a bare `// cov:unreachable` with no
      #      stated invariant, which the shared gate rejects outright.
      # Nothing is dropped: the job below is the old one, byte for byte.
      coverage-gate: "off"

  # ---------------------------------------------------------------------------
  # Repo-specific jobs, copied verbatim from the pre-adoption ci.yml.
  # ---------------------------------------------------------------------------

  coverage:
    name: Coverage (100% lines, cov:unreachable exempt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - uses: taiki-e/install-action@59012be0884e296ca2da49b530610e72c49039ad # v2.81.6
        with:
          tool: cargo-llvm-cov
      # Coverage spans the whole workspace — the reader's read/map/symbolic-fill
      # paths are exercised by the corpus integration tests, not only unit tests.
      # The integration test files themselves are excluded. Every executable
      # library line must be hit at least once; a `// cov:unreachable` marker
      # exempts a provably-dead defensive guard kept to stay panic-free.
      - name: Generate lcov
        run: cargo llvm-cov --workspace --lcov --ignore-filename-regex 'tests/' --output-path lcov.info
      - name: Enforce line coverage (unreachable defensive arms must carry // cov:unreachable)
        shell: bash
        run: |
          fail=0
          while IFS= read -r line; do
            if [[ "$line" == SF:* ]]; then
              f="${line#SF:}"
            elif [[ "$line" =~ ^DA:([0-9]+),0$ ]]; then
              n="${BASH_REMATCH[1]}"
              # The marker may sit on the line itself or the comment directly above
              # (llvm-cov attributes an unreachable statement's zero-hit to either).
              src="$(awk -v ln="$n" 'NR==ln' "$f")"
              prev="$(awk -v ln="$n" 'NR==ln-1' "$f")"
              if [[ "$src" == *cov:unreachable* || "$prev" == *cov:unreachable* ]]; then
                echo "exempt (// cov:unreachable): $f:$n"
              else
                echo "::error::Uncovered line $f:$n:$src"
                fail=1
              fi
            fi
          done < lcov.info
          if [[ "$fail" -ne 0 ]]; then exit 1; fi
          echo "All executable lines covered, or annotated // cov:unreachable."

  geiger:
    name: Unsafe Audit (cargo-geiger)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - run: cargo install cargo-geiger --locked
      - run: cargo geiger 2>&1 || true
